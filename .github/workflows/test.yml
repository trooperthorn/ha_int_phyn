# Pytest, translations sync, and mypy; release.yml calls this workflow so the same jobs gate every release.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      # aiophyn is installed with --no-deps; see docs/operations.md.
      - name: Install the test harness
        run: |
          pip install -r requirements_test.txt
          pip install --no-deps aiophyn==2026.6.4
      - name: Verify runtime versions
        run: python -c "from importlib.metadata import version; import sys; print(version('homeassistant')); assert version('homeassistant') == '2026.9.0'; assert sys.version_info[:2] == (3, 14)"
      - name: Run the suite
        run: pytest tests/ -q

  # Ensure translations/en.json stays in sync with strings.json.
  translations:
    name: Translations in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check translations/en.json is in sync with strings.json
        run: python scripts/sync_translations.py --check

  # Type checking with mypy.
  type-check:
    name: mypy type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
      - name: Run mypy type checking
        run: mypy custom_components/phyn --ignore-missing-imports --exclude config_flow.py
